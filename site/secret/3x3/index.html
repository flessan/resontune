<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cube Solver — Interactive 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    /* Reset and base */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg-0: #08080c;
      --bg-1: #12121a;
      --fg: #ffffff;
      --muted: rgba(255,255,255,0.55);
      --dim: rgba(255,255,255,0.32);
      --accent: #ff9500;
      --accent-2: #34c759;
      --accent-3: #ff3b30;
      --accent-4: #ffd60a;
      --border: rgba(255,255,255,0.08);
      --border-hi: rgba(255,255,255,0.16);
      --panel: rgba(255,255,255,0.03);
      --panel-hi: rgba(255,255,255,0.06);
    }
    
    body {
      font-family: 'Bricolage Grotesque', sans-serif;
      background: var(--bg-0);
      color: var(--fg);
      overflow: hidden;
      height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    /* Background */
    .bg-atmosphere {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: 
        radial-gradient(ellipse 60% 50% at 15% 20%, rgba(255,149,0,0.10), transparent 70%),
        radial-gradient(ellipse 50% 60% at 85% 80%, rgba(52,199,89,0.07), transparent 70%),
        radial-gradient(ellipse 70% 60% at 50% 50%, rgba(255,59,48,0.04), transparent 80%),
        linear-gradient(180deg, var(--bg-0), var(--bg-1));
    }
    
    .bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: 
        linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
    }
    
    /* Layout */
    .app {
      position: relative; z-index: 1;
      height: 100vh;
      display: grid;
      grid-template-columns: 320px 1fr 320px;
      grid-template-rows: auto 1fr;
      gap: 14px;
      padding: 14px;
    }
    
    header {
      grid-column: 1 / -1;
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 8px;
    }
    
    .brand {
      display: flex; align-items: center; gap: 14px;
    }
    
    .brand-mark {
      width: 40px; height: 40px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      transform: rotate(-12deg);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .brand:hover .brand-mark { transform: rotate(0deg) scale(1.05); }
    
    .brand-mark span {
      border-radius: 4px;
      box-shadow: 0 0 12px currentColor;
    }
    .brand-mark span:nth-child(1) { background: #ff9500; color: rgba(255,149,0,0.4); }
    .brand-mark span:nth-child(2) { background: #34c759; color: rgba(52,199,89,0.4); }
    .brand-mark span:nth-child(3) { background: #ff3b30; color: rgba(255,59,48,0.4); }
    .brand-mark span:nth-child(4) { background: #ffd60a; color: rgba(255,214,10,0.4); }
    
    .brand-title {
      font-size: 24px; font-weight: 900; letter-spacing: -0.02em; line-height: 1;
      background: linear-gradient(180deg, #fff, #b0b0b0);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-sub {
      font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 4px;
    }
    
    .shortcuts {
      display: flex; align-items: center; gap: 16px;
      font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace;
    }
    .shortcuts > span { display: flex; align-items: center; gap: 6px; }
    
    .kbd {
      display: inline-block; padding: 2px 6px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
      color: var(--fg);
    }
    
    /* Panel */
    .panel {
      background: var(--panel);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 18px;
    }
    
    .panel-section {
      display: flex; flex-direction: column; gap: 10px;
    }
    
    .panel-title {
      font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); font-family: 'JetBrains Mono', monospace;
      display: flex; align-items: center; gap: 8px;
    }
    .panel-title::before {
      content: ''; width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 8px var(--accent);
    }
    
    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13px; font-weight: 700; letter-spacing: 0.05em;
      font-family: 'JetBrains Mono', monospace;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--fg);
      cursor: pointer;
      transition: all 0.18s ease;
      user-select: none;
      text-transform: uppercase;
    }
    .btn:hover:not(:disabled) {
      background: var(--panel-hi);
      border-color: var(--border-hi);
      transform: translateY(-1px);
    }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #ff7a00);
      border-color: transparent;
      color: #1a0d00;
      box-shadow: 0 6px 20px -6px rgba(255,149,0,0.6), inset 0 1px 0 rgba(255,255,255,0.3);
    }
    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #ffaa33, var(--accent));
      box-shadow: 0 8px 28px -6px rgba(255,149,0,0.7), inset 0 1px 0 rgba(255,255,255,0.4);
    }
    
    .btn-secondary {
      background: linear-gradient(135deg, var(--accent-2), #2bb350);
      border-color: transparent;
      color: #001a05;
      box-shadow: 0 6px 20px -6px rgba(52,199,89,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
    }
    .btn-secondary:hover:not(:disabled) {
      background: linear-gradient(135deg, #4ade80, var(--accent-2));
      box-shadow: 0 8px 28px -6px rgba(52,199,89,0.6);
    }
    
    .btn-danger {
      background: rgba(255,59,48,0.08);
      border-color: rgba(255,59,48,0.25);
      color: var(--accent-3);
    }
    .btn-danger:hover:not(:disabled) {
      background: rgba(255,59,48,0.15);
      border-color: rgba(255,59,48,0.4);
    }
    
    /* Move grid */
    .move-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .move-btn {
      padding: 10px 4px;
      font-size: 13px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-bottom: 2px solid rgba(255,255,255,0.04);
      color: var(--fg);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.12s ease;
      position: relative;
    }
    .move-btn:hover {
      background: rgba(255,149,0,0.10);
      border-color: rgba(255,149,0,0.4);
      color: var(--accent);
      transform: translateY(-1px);
    }
    .move-btn:active {
      transform: translateY(1px);
      border-bottom-width: 1px;
    }
    .move-btn .face-dot {
      position: absolute;
      top: 4px; right: 4px;
      width: 5px; height: 5px;
      border-radius: 50%;
    }
    
    /* Stats */
    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .stat-card {
      background: rgba(255,255,255,0.025);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .stat-label {
      font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-bottom: 6px;
    }
    .stat-value {
      font-size: 22px; font-weight: 900;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .stat-value.accent { color: var(--accent); }
    .stat-value.green { color: var(--accent-2); }
    .stat-value.red { color: var(--accent-3); }
    .stat-value.yellow { color: var(--accent-4); }
    
    /* Slider */
    .slider-row {
      display: flex; align-items: center; gap: 10px;
    }
    .slider {
      -webkit-appearance: none; appearance: none;
      flex: 1; height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px; outline: none;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 16px; height: 16px;
      background: var(--accent);
      border-radius: 50%; cursor: pointer;
      box-shadow: 0 0 10px rgba(255,149,0,0.6);
      transition: transform 0.15s ease;
    }
    .slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
    .slider::-moz-range-thumb {
      width: 16px; height: 16px;
      background: var(--accent);
      border-radius: 50%; cursor: pointer; border: none;
      box-shadow: 0 0 10px rgba(255,149,0,0.6);
    }
    .slider-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; color: var(--muted);
      min-width: 48px; text-align: right;
    }
    
    /* Canvas */
    .canvas-wrap {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: 
        radial-gradient(ellipse at center, rgba(255,149,0,0.06), transparent 70%),
        rgba(255,255,255,0.015);
      border: 1px solid var(--border);
    }
    canvas { display: block; width: 100% !important; height: 100% !important; }
    
    /* Status overlay */
    .status-bar {
      position: absolute;
      top: 16px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 10;
      gap: 12px;
    }
    .status-pill {
      background: rgba(8,8,12,0.65);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 100px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--fg);
      display: flex; align-items: center; gap: 8px;
      letter-spacing: 0.1em;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 8px var(--accent-2);
      animation: pulse 2s ease infinite;
    }
    .status-dot.solving {
      background: var(--accent); box-shadow: 0 0 8px var(--accent);
      animation: pulse 0.6s ease infinite;
    }
    .status-dot.scrambled {
      background: var(--accent-3); box-shadow: 0 0 8px var(--accent-3);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    
    .move-display {
      position: absolute;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: rgba(8,8,12,0.75);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 10px 24px;
      border-radius: 12px;
      font-size: 28px; font-weight: 900;
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent);
      letter-spacing: 0.05em;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 10;
      text-shadow: 0 0 20px rgba(255,149,0,0.4);
    }
    .move-display.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }
    
    /* Unfolded cube */
    .unfolded {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
      aspect-ratio: 4/3;
      width: 100%;
    }
    .face {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 2px;
      background: rgba(255,255,255,0.02);
      padding: 2px;
      border-radius: 6px;
    }
    .face-u { grid-column: 2; grid-row: 1; }
    .face-l { grid-column: 1; grid-row: 2; }
    .face-f { grid-column: 2; grid-row: 2; }
    .face-r { grid-column: 3; grid-row: 2; }
    .face-b { grid-column: 4; grid-row: 2; }
    .face-d { grid-column: 2; grid-row: 3; }
    .sticker-cell {
      background: #080808;
      border-radius: 3px;
      transition: background 0.3s ease;
    }
    
    /* History */
    .history-list {
      display: flex; flex-wrap: wrap; gap: 5px;
      max-height: 200px; overflow-y: auto;
      align-content: flex-start;
      padding: 2px;
    }
    .move-chip {
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 11px; font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--fg);
      animation: chipIn 0.3s ease;
      letter-spacing: 0.03em;
    }
    .move-chip.scramble {
      color: var(--accent-3);
      border-color: rgba(255,59,48,0.25);
      background: rgba(255,59,48,0.05);
    }
    .move-chip.solve {
      color: var(--accent-2);
      border-color: rgba(52,199,89,0.25);
      background: rgba(52,199,89,0.05);
    }
    .move-chip.manual {
      color: var(--accent);
      border-color: rgba(255,149,0,0.25);
      background: rgba(255,149,0,0.05);
    }
    .move-chip.undo {
      color: var(--accent-4);
      border-color: rgba(255,214,10,0.25);
      background: rgba(255,214,10,0.05);
    }
    @keyframes chipIn {
      from { opacity: 0; transform: scale(0.6); }
      to { opacity: 1; transform: scale(1); }
    }
    .empty-msg {
      color: var(--dim); font-size: 11px; padding: 8px 0;
      font-family: 'JetBrains Mono', monospace;
    }
    
    /* Toast */
    .toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(20,20,28,0.95);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-hi);
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 13px; font-weight: 600;
      z-index: 100; opacity: 0;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5);
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    
    /* Button row */
    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { flex: 1; }
    
    /* Focus */
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    
    /* Responsive */
    @media (max-width: 1180px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 50vh auto auto;
        height: auto; min-height: 100vh;
      }
      body { overflow-y: auto; overflow-x: hidden; }
      .panel { max-height: none; }
      .shortcuts { display: none; }
    }
    
    @media (max-width: 640px) {
      .app { padding: 10px; gap: 10px; }
      .brand-title { font-size: 20px; }
      .canvas-wrap { min-height: 380px; }
    }
  </style>
</head>
<body>
  <div class="bg-atmosphere"></div>
  <div class="bg-grid"></div>
  
  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-mark">
          <span></span><span></span><span></span><span></span>
        </div>
        <div>
          <div class="brand-title">CUBE SOLVER</div>
          <div class="brand-sub">Interactive 3D · v1.0</div>
        </div>
      </div>
      <div class="shortcuts">
        <span><span class="kbd">U</span><span class="kbd">D</span><span class="kbd">L</span><span class="kbd">R</span><span class="kbd">F</span><span class="kbd">B</span> moves</span>
        <span><span class="kbd">Shift</span> prime</span>
        <span><span class="kbd">Alt</span> double</span>
        <span><span class="kbd">Space</span> solve</span>
        <span><span class="kbd">Esc</span> reset</span>
      </div>
    </header>
    
    <aside class="panel">
      <div class="panel-section">
        <div class="panel-title">Actions</div>
        <button class="btn btn-primary" id="scrambleBtn">Scramble</button>
        <div class="btn-row">
          <button class="btn btn-secondary" id="solveBtn">Solve</button>
          <button class="btn" id="stepBtn">Step</button>
        </div>
        <div class="btn-row">
          <button class="btn" id="undoBtn">Undo</button>
          <button class="btn btn-danger" id="resetBtn">Reset</button>
        </div>
      </div>
      
      <div class="panel-section">
        <div class="panel-title">Manual Moves</div>
        <div class="move-grid" id="moveGrid">
          <!-- populated by JS -->
        </div>
      </div>
      
      <div class="panel-section">
        <div class="panel-title">Animation</div>
        <div class="slider-row">
          <input type="range" min="60" max="800" value="260" class="slider" id="speedSlider" />
          <span class="slider-val" id="speedVal">260ms</span>
        </div>
      </div>
      
      <div class="panel-section">
        <div class="panel-title">Scramble Length</div>
        <div class="slider-row">
          <input type="range" min="5" max="40" value="22" class="slider" id="scrambleSlider" />
          <span class="slider-val" id="scrambleVal">22 moves</span>
        </div>
      </div>
    </aside>
    
    <main class="canvas-wrap">
      <div class="status-bar">
        <div class="status-pill">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">SOLVED</span>
        </div>
        <div class="status-pill" id="moveCounter">
          <span style="color: var(--muted)">MOVES</span>
          <span style="color: var(--accent); font-weight: 700;" id="moveCount">0</span>
        </div>
      </div>
      <div class="move-display" id="moveDisplay">U</div>
      <canvas id="cube-canvas"></canvas>
    </main>
    
    <aside class="panel">
      <div class="panel-section">
        <div class="panel-title">Cube State</div>
        <div class="unfolded" id="unfolded">
          <div class="face face-u" data-face="U"></div>
          <div class="face face-l" data-face="L"></div>
          <div class="face face-f" data-face="F"></div>
          <div class="face face-r" data-face="R"></div>
          <div class="face face-b" data-face="B"></div>
          <div class="face face-d" data-face="D"></div>
        </div>
      </div>
      
      <div class="panel-section">
        <div class="panel-title">Statistics</div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Total</div>
            <div class="stat-value accent" id="statTotal">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Time</div>
            <div class="stat-value yellow" id="statTime">00:00</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Scramble</div>
            <div class="stat-value red" id="statScramble">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Solution</div>
            <div class="stat-value green" id="statSolution">0</div>
          </div>
        </div>
      </div>
      
      <div class="panel-section" style="flex: 1; min-height: 0;">
        <div class="panel-title">Move History</div>
        <div class="history-list" id="historyList">
          <div class="empty-msg">No moves yet</div>
        </div>
      </div>
    </aside>
  </div>
  
  <div class="toast" id="toast"></div>
  
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    
    // === Configuration ===
    const COLORS = {
      right: 0xff3b30,
      left: 0xff9500,
      up: 0xf5f5f5,
      down: 0xffd60a,
      front: 0x34c759,
      back: 0x0a84ff,
      core: 0x0a0a0a,
    };
    
    const FACE_MAP = {
      U: { axis: 'y', layer: 1, dir: -1 },
      D: { axis: 'y', layer: -1, dir: 1 },
      R: { axis: 'x', layer: 1, dir: -1 },
      L: { axis: 'x', layer: -1, dir: 1 },
      F: { axis: 'z', layer: 1, dir: -1 },
      B: { axis: 'z', layer: -1, dir: 1 },
    };
    
    const FACE_COLORS_CSS = {
      right: '#ff3b30',
      left: '#ff9500',
      up: '#f5f5f5',
      down: '#ffd60a',
      front: '#34c759',
      back: '#0a84ff',
      core: '#0a0a0a',
    };
    
    // === State ===
    let moveHistory = [];
    let isAnimating = false;
    let isProcessing = false;
    let moveQueue = [];
    let currentMoveSpeed = 260;
    let scrambleLength = 22;
    let solveInProgress = false;
    let solutionQueue = [];
    let startTime = null;
    let timerInterval = null;
    let timerRunning = false;
    
    // === Three.js setup ===
    const canvas = document.getElementById('cube-canvas');
    const canvasWrap = canvas.parentElement;
    
    const scene = new THREE.Scene();
    scene.background = null;
    
    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
    camera.position.set(5.5, 4.5, 6.5);
    camera.lookAt(0, 0, 0);
    
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    
    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
    keyLight.position.set(8, 12, 8);
    scene.add(keyLight);
    
    const fillLight = new THREE.DirectionalLight(0xff9500, 0.35);
    fillLight.position.set(-8, 4, -6);
    scene.add(fillLight);
    
    const rimLight = new THREE.DirectionalLight(0x34c759, 0.25);
    rimLight.position.set(0, -5, -8);
    scene.add(rimLight);
    
    // Controls
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.rotateSpeed = 0.8;
    controls.enablePan = false;
    controls.minDistance = 5;
    controls.maxDistance = 18;
    
    // === Build Cube ===
    const cubeRoot = new THREE.Group();
    scene.add(cubeRoot);
    
    const cubies = [];
    
    const coreGeom = new RoundedBoxGeometry(0.96, 0.96, 0.96, 3, 0.08);
    const coreMat = new THREE.MeshStandardMaterial({
      color: COLORS.core, roughness: 0.6, metalness: 0.1,
    });
    
    const stickerGeom = new THREE.BoxGeometry(0.82, 0.82, 0.05);
    const stickerMats = {
      right: new THREE.MeshStandardMaterial({ color: COLORS.right, roughness: 0.35, metalness: 0.05 }),
      left: new THREE.MeshStandardMaterial({ color: COLORS.left, roughness: 0.35, metalness: 0.05 }),
      up: new THREE.MeshStandardMaterial({ color: COLORS.up, roughness: 0.3, metalness: 0.05 }),
      down: new THREE.MeshStandardMaterial({ color: COLORS.down, roughness: 0.3, metalness: 0.05 }),
      front: new THREE.MeshStandardMaterial({ color: COLORS.front, roughness: 0.35, metalness: 0.05 }),
      back: new THREE.MeshStandardMaterial({ color: COLORS.back, roughness: 0.35, metalness: 0.05 }),
    };
    
    function createCubie(x, y, z) {
      const group = new THREE.Group();
      
      const core = new THREE.Mesh(coreGeom, coreMat);
      group.add(core);
      
      const off = 0.5;
      if (x === 1) {
        const s = new THREE.Mesh(stickerGeom, stickerMats.right);
        s.position.set(off, 0, 0); s.rotation.y = Math.PI / 2;
        group.add(s);
      }
      if (x === -1) {
        const s = new THREE.Mesh(stickerGeom, stickerMats.left);
        s.position.set(-off, 0, 0); s.rotation.y = -Math.PI / 2;
        group.add(s);
      }
      if (y === 1) {
        const s = new THREE.Mesh(stickerGeom, stickerMats.up);
        s.position.set(0, off, 0); s.rotation.x = -Math.PI / 2;
        group.add(s);
      }
      if (y === -1) {
        const s = new THREE.Mesh(stickerGeom, stickerMats.down);
        s.position.set(0, -off, 0); s.rotation.x = Math.PI / 2;
        group.add(s);
      }
      if (z === 1) {
        const s = new THREE.Mesh(stickerGeom, stickerMats.front);
        s.position.set(0, 0, off);
        group.add(s);
      }
      if (z === -1) {
        const s = new THREE.Mesh(stickerGeom, stickerMats.back);
        s.position.set(0, 0, -off); s.rotation.y = Math.PI;
        group.add(s);
      }
      
      group.position.set(x, y, z);
      group.userData = { initial: { x, y, z } };
      return group;
    }
    
    for (let x = -1; x <= 1; x++) {
      for (let y = -1; y <= 1; y++) {
        for (let z = -1; z <= 1; z++) {
          if (x === 0 && y === 0 && z === 0) continue;
          const c = createCubie(x, y, z);
          cubeRoot.add(c);
          cubies.push(c);
        }
      }
    }
    
    // Particle background
    const particleCount = 240;
    const pGeom = new THREE.BufferGeometry();
    const pPos = new Float32Array(particleCount * 3);
    const pCol = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
      const r = 8 + Math.random() * 14;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      pPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
      pPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
      pPos[i*3+2] = r * Math.cos(phi);
      
      const c = Math.random();
      if (c < 0.5) { pCol[i*3]=1; pCol[i*3+1]=0.58; pCol[i*3+2]=0; }
      else if (c < 0.8) { pCol[i*3]=0.2; pCol[i*3+1]=0.8; pCol[i*3+2]=0.35; }
      else { pCol[i*3]=1; pCol[i*3+1]=0.24; pCol[i*3+2]=0.19; }
    }
    pGeom.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    pGeom.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
    const pMat = new THREE.PointsMaterial({
      size: 0.06, transparent: true, opacity: 0.6,
      sizeAttenuation: true, vertexColors: true,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const particles = new THREE.Points(pGeom, pMat);
    scene.add(particles);
    
    // === Move execution ===
    function parseMove(notation) {
      const face = notation[0];
      const mod = notation.slice(1);
      const { axis, layer, dir } = FACE_MAP[face];
      let angle = dir * Math.PI / 2;
      if (mod === "'") angle = -angle;
      else if (mod === '2') angle = dir * Math.PI;
      return { axis, layer, angle };
    }
    
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }
    
    function animateMove(move, speed) {
      return new Promise(resolve => {
        const { axis, layer, angle } = parseMove(move);
        const layerCubies = cubies.filter(c => Math.round(c.position[axis]) === layer);
        
        const pivot = new THREE.Group();
        cubeRoot.add(pivot);
        layerCubies.forEach(c => pivot.attach(c));
        
        const duration = Math.max(40, speed);
        const start = performance.now();
        const axisVec = new THREE.Vector3(
          axis === 'x' ? 1 : 0,
          axis === 'y' ? 1 : 0,
          axis === 'z' ? 1 : 0
        );
        
        // Show move display
        showMoveDisplay(move);
        
        function step(now) {
          const t = Math.min((now - start) / duration, 1);
          const eased = easeInOutCubic(t);
          pivot.setRotationFromAxisAngle(axisVec, angle * eased);
          
          if (t < 1) {
            requestAnimationFrame(step);
          } else {
            pivot.updateMatrixWorld(true);
            const toReparent = [...pivot.children];
            toReparent.forEach(c => {
              cubeRoot.attach(c);
              c.position.x = Math.round(c.position.x);
              c.position.y = Math.round(c.position.y);
              c.position.z = Math.round(c.position.z);
              c.quaternion.normalize();
            });
            cubeRoot.remove(pivot);
            resolve();
          }
        }
        requestAnimationFrame(step);
      });
    }
    
    async function processQueue() {
      if (isProcessing) return;
      isProcessing = true;
      
      while (moveQueue.length > 0) {
        const { move, type, speed, silent } = moveQueue.shift();
        isAnimating = true;
        updateButtons();
        await animateMove(move, speed || currentMoveSpeed);
        isAnimating = false;
        
        if (!silent) {
          moveHistory.push({ move, type });
          updateHistory();
          updateStats();
        }
        renderUnfolded();
      }
      
      isProcessing = false;
      updateButtons();
      
      // Check solved state
      const wasSolving = solveInProgress;
      solveInProgress = false;
      
      if (isCubeSolved() && moveHistory.length > 0) {
        moveHistory = [];
        updateHistory();
        updateStats();
        renderUnfolded();
        updateStatus('solved');
        stopTimer();
        if (wasSolving) {
          showToast('Cube solved!');
        } else {
          showToast('Solved! History cleared.');
        }
      } else if (wasSolving) {
        // Solve didn't reach solved state? Shouldn't happen but handle.
        updateStatus('manual');
      }
    }
    
    function queueMove(move, type = 'manual', options = {}) {
      moveQueue.push({ move, type, speed: options.speed, silent: options.silent });
      if (!isProcessing) processQueue();
    }
    
    function queueMoves(moves, type, options = {}) {
      moves.forEach(m => moveQueue.push({ move: m, type, speed: options.speed, silent: options.silent }));
      if (!isProcessing) processQueue();
    }
    
    // === Scramble ===
    function generateScramble(length) {
      const faces = ['U', 'D', 'L', 'R', 'F', 'B'];
      const mods = ['', "'", '2'];
      const result = [];
      let last = null, secondLast = null;
      const opp = { U: 'D', D: 'U', L: 'R', R: 'L', F: 'B', B: 'F' };
      
      for (let i = 0; i < length; i++) {
        let face;
        do {
          face = faces[Math.floor(Math.random() * 6)];
        } while (face === last || (face === secondLast && opp[face] === last));
        const mod = mods[Math.floor(Math.random() * 3)];
        result.push(face + mod);
        secondLast = last;
        last = face;
      }
      return result;
    }
    
    function scramble() {
      if (isAnimating || moveQueue.length > 0) return;
      // Reset to solved first
      cubies.forEach(c => {
        const { initial } = c.userData;
        c.position.set(initial.x, initial.y, initial.z);
        c.quaternion.set(0, 0, 0, 1);
      });
      moveHistory = [];
      solutionQueue = [];
      updateHistory();
      updateStats();
      renderUnfolded();
      
      const moves = generateScramble(scrambleLength);
      queueMoves(moves, 'scramble');
      updateStatus('scrambling');
      startTimer();
      showToast(`Scrambling with ${moves.length} moves`);
    }
    
    // === Solve ===
    function invertMove(move) {
      const face = move[0];
      const mod = move.slice(1);
      if (mod === "'") return face;
      if (mod === '2') return move;
      return face + "'";
    }
    
    function solve() {
      if (isAnimating || moveQueue.length > 0) return;
      if (moveHistory.length === 0) {
        showToast('Cube is already solved');
        return;
      }
      const moves = moveHistory.map(h => h.move).reverse().map(invertMove);
      solutionQueue = [];
      solveInProgress = true;
      queueMoves(moves, 'solve');
      updateStatus('solving');
      showToast(`Solving with ${moves.length} moves`);
    }
    
    function stepSolve() {
      if (isAnimating || moveQueue.length > 0) return;
      if (moveHistory.length === 0 && solutionQueue.length === 0) {
        showToast('Nothing to solve');
        return;
      }
      if (solutionQueue.length === 0) {
        // Compute solution
        solutionQueue = moveHistory.map(h => h.move).reverse().map(invertMove);
      }
      const move = solutionQueue.shift();
      queueMove(move, 'solve');
      showToast(`Step: ${move} · ${solutionQueue.length} remaining`);
    }
    
    // === Reset / Undo ===
    function resetCube() {
      if (isAnimating) return;
      moveQueue = [];
      cubies.forEach(c => {
        const { initial } = c.userData;
        c.position.set(initial.x, initial.y, initial.z);
        c.quaternion.set(0, 0, 0, 1);
      });
      moveHistory = [];
      solutionQueue = [];
      solveInProgress = false;
      isProcessing = false;
      updateHistory();
      updateStats();
      renderUnfolded();
      updateStatus('solved');
      stopTimer();
      updateButtons();
      showToast('Cube reset');
    }
    
    function undoLast() {
      if (isAnimating || moveQueue.length > 0) return;
      if (moveHistory.length === 0) {
        showToast('Nothing to undo');
        return;
      }
      const last = moveHistory.pop();
      const inv = invertMove(last.move);
      queueMove(inv, 'undo', { silent: false });
      updateHistory();
      updateStats();
      showToast(`Undid ${last.move}`);
    }
    
    // === Solved check ===
    function isCubeSolved() {
      return cubies.every(c => {
        const { initial } = c.userData;
        const posMatch = Math.round(c.position.x) === initial.x &&
                         Math.round(c.position.y) === initial.y &&
                         Math.round(c.position.z) === initial.z;
        const q = c.quaternion;
        const rotMatch = Math.abs(q.x) < 0.05 && Math.abs(q.y) < 0.05 &&
                         Math.abs(q.z) < 0.05 && Math.abs(q.w - 1) < 0.05;
        return posMatch && rotMatch;
      });
    }
    
    // === 2D unfolded view ===
    function getCurrentColor(cubie, currentDir) {
      const invQ = cubie.quaternion.clone().invert();
      const initialDir = currentDir.clone().applyQuaternion(invQ);
      
      const ax = Math.abs(initialDir.x);
      const ay = Math.abs(initialDir.y);
      const az = Math.abs(initialDir.z);
      
      let axis, value;
      if (ax >= ay && ax >= az) {
        axis = 'x'; value = Math.sign(initialDir.x);
      } else if (ay >= ax && ay >= az) {
        axis = 'y'; value = Math.sign(initialDir.y);
      } else {
        axis = 'z'; value = Math.sign(initialDir.z);
      }
      
      const { initial } = cubie.userData;
      if (initial[axis] === value) {
        const key = `${value > 0 ? '+' : '-'}${axis}`;
        const map = {
          '+x': 'right', '-x': 'left',
          '+y': 'up', '-y': 'down',
          '+z': 'front', '-z': 'back',
        };
        return FACE_COLORS_CSS[map[key]];
      }
      return FACE_COLORS_CSS.core;
    }
    
    function getFaceGrid(face) {
      const faceInfo = {
        U: { dir: new THREE.Vector3(0, 1, 0), axis: 'y', value: 1,
             rowAxis: 'z', rowRange: [-1, 0, 1], colAxis: 'x', colRange: [-1, 0, 1] },
        D: { dir: new THREE.Vector3(0, -1, 0), axis: 'y', value: -1,
             rowAxis: 'z', rowRange: [1, 0, -1], colAxis: 'x', colRange: [-1, 0, 1] },
        F: { dir: new THREE.Vector3(0, 0, 1), axis: 'z', value: 1,
             rowAxis: 'y', rowRange: [1, 0, -1], colAxis: 'x', colRange: [-1, 0, 1] },
        B: { dir: new THREE.Vector3(0, 0, -1), axis: 'z', value: -1,
             rowAxis: 'y', rowRange: [1, 0, -1], colAxis: 'x', colRange: [1, 0, -1] },
        L: { dir: new THREE.Vector3(-1, 0, 0), axis: 'x', value: -1,
             rowAxis: 'y', rowRange: [1, 0, -1], colAxis: 'z', colRange: [-1, 0, 1] },
        R: { dir: new THREE.Vector3(1, 0, 0), axis: 'x', value: 1,
             rowAxis: 'y', rowRange: [1, 0, -1], colAxis: 'z', colRange: [1, 0, -1] },
      };
      
      const info = faceInfo[face];
      const layerCubies = cubies.filter(c => Math.round(c.position[info.axis]) === info.value);
      
      const grid = [];
      for (const r of info.rowRange) {
        const row = [];
        for (const c of info.colRange) {
          const cubie = layerCubies.find(cub =>
            Math.round(cub.position[info.rowAxis]) === r &&
            Math.round(cub.position[info.colAxis]) === c
          );
          if (cubie) {
            row.push(getCurrentColor(cubie, info.dir));
          } else {
            row.push(FACE_COLORS_CSS.core);
          }
        }
        grid.push(row);
      }
      return grid;
    }
    
    function renderUnfolded() {
      ['U', 'D', 'L', 'R', 'F', 'B'].forEach(face => {
        const el = document.querySelector(`.face-${face.toLowerCase()}`);
        if (!el) return;
        const grid = getFaceGrid(face);
        el.innerHTML = '';
        grid.forEach(row => {
          row.forEach(color => {
            const cell = document.createElement('div');
            cell.className = 'sticker-cell';
            cell.style.background = color;
            el.appendChild(cell);
          });
        });
      });
    }
    
    // === UI ===
    function updateHistory() {
      const list = document.getElementById('historyList');
      if (moveHistory.length === 0) {
        list.innerHTML = '<div class="empty-msg">No moves yet</div>';
        return;
      }
      list.innerHTML = moveHistory.map(h =>
        `<div class="move-chip ${h.type}">${h.move}</div>`
      ).join('');
      list.scrollTop = list.scrollHeight;
    }
    
    function updateStats() {
      const total = moveHistory.length;
      const scrambleCount = moveHistory.filter(h => h.type === 'scramble').length;
      const solveCount = moveHistory.filter(h => h.type === 'solve').length;
      
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statScramble').textContent = scrambleCount;
      document.getElementById('statSolution').textContent = solveCount;
      document.getElementById('moveCount').textContent = total;
    }
    
    function updateStatus(state) {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      dot.classList.remove('solving', 'scrambled');
      
      if (state === 'solving') {
        dot.classList.add('solving');
        text.textContent = 'SOLVING';
      } else if (state === 'scrambling') {
        dot.classList.add('scrambled');
        text.textContent = 'SCRAMBLED';
      } else if (state === 'manual') {
        text.textContent = 'IN PROGRESS';
      } else {
        text.textContent = 'SOLVED';
      }
    }
    
    function updateButtons() {
      const busy = isAnimating || moveQueue.length > 0;
      document.getElementById('scrambleBtn').disabled = busy;
      document.getElementById('solveBtn').disabled = busy;
      document.getElementById('stepBtn').disabled = busy;
      document.getElementById('undoBtn').disabled = busy;
      document.getElementById('resetBtn').disabled = isAnimating;
    }
    
    function startTimer() {
      if (timerRunning) return;
      timerRunning = true;
      startTime = Date.now();
      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const s = String(elapsed % 60).padStart(2, '0');
        document.getElementById('statTime').textContent = `${m}:${s}`;
      }, 200);
    }
    
    function stopTimer() {
      timerRunning = false;
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }
    
    let moveDisplayTimeout;
    function showMoveDisplay(move) {
      const el = document.getElementById('moveDisplay');
      el.textContent = move;
      el.classList.add('show');
      clearTimeout(moveDisplayTimeout);
      moveDisplayTimeout = setTimeout(() => el.classList.remove('show'), 800);
    }
    
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toast.classList.remove('show'), 2200);
    }
    
    // === Build move buttons ===
    const moveBtnData = [
      { face: 'U', color: '#f5f5f5' },
      { face: 'D', color: '#ffd60a' },
      { face: 'L', color: '#ff9500' },
      { face: 'R', color: '#ff3b30' },
      { face: 'F', color: '#34c759' },
      { face: 'B', color: '#0a84ff' },
    ];
    
    const moveGrid = document.getElementById('moveGrid');
    moveBtnData.forEach(({ face, color }) => {
      ['', "'", '2'].forEach(mod => {
        const btn = document.createElement('button');
        btn.className = 'move-btn';
        btn.dataset.move = face + mod;
        btn.innerHTML = `${face}${mod}<span class="face-dot" style="background:${color}"></span>`;
        btn.addEventListener('click', () => {
          queueMove(face + mod, 'manual');
          updateStatus('manual');
          startTimer();
        });
        moveGrid.appendChild(btn);
      });
    });
    
    // === Event handlers ===
    document.getElementById('scrambleBtn').addEventListener('click', scramble);
    document.getElementById('solveBtn').addEventListener('click', solve);
    document.getElementById('stepBtn').addEventListener('click', stepSolve);
    document.getElementById('resetBtn').addEventListener('click', resetCube);
    document.getElementById('undoBtn').addEventListener('click', undoLast);
    
    document.getElementById('speedSlider').addEventListener('input', e => {
      currentMoveSpeed = parseInt(e.target.value);
      document.getElementById('speedVal').textContent = currentMoveSpeed + 'ms';
    });
    
    document.getElementById('scrambleSlider').addEventListener('input', e => {
      scrambleLength = parseInt(e.target.value);
      document.getElementById('scrambleVal').textContent = scrambleLength + ' moves';
    });
    
    // Keyboard
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      const key = e.key.toUpperCase();
      const faces = ['U', 'D', 'L', 'R', 'F', 'B'];
      if (faces.includes(key)) {
        e.preventDefault();
        let move = key;
        if (e.shiftKey) move += "'";
        else if (e.altKey) move += "2";
        queueMove(move, 'manual');
        updateStatus('manual');
        startTimer();
      } else if (e.key === ' ') {
        e.preventDefault();
        solve();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        resetCube();
      } else if (e.key === 'z' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        undoLast();
      }
    });
    
    // === Resize ===
    function resize() {
      const rect = canvasWrap.getBoundingClientRect();
      const w = Math.max(1, rect.width);
      const h = Math.max(1, rect.height);
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    new ResizeObserver(resize).observe(canvasWrap);
    resize();
    
    // === Animation loop ===
    let lastTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      
      // Rotate particles slowly
      particles.rotation.y += dt * 0.02;
      particles.rotation.x += dt * 0.01;
      
      controls.update();
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);
    
    // Initial render
    renderUnfolded();
    updateButtons();
    
    // Welcome toast
    setTimeout(() => showToast('Drag to rotate · Scroll to zoom · Press U D L R F B for moves'), 600);
  </script>
</body>
</html>
